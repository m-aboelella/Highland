[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "highland-educational"
version = "0.1.0"
description = "Self-contained mock enterprise systems and MCP connectors for Highland"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "apscheduler>=3.11,<4",
  "cohere>=7,<8",
  "fastapi>=0.115,<1",
  "faiss-cpu>=1.11,<2",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "markdown>=3.8,<4",
  "mcp>=1.12,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
  "weasyprint>=66,<67",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pip-tools>=7.6,<8",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.12,<1",
]

[project.scripts]
highland = "highland.cli:main"
highland-mocks = "highland_mocks.cli:main"
highland-mcp = "highland_mocks.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/highland", "src/highland_mocks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "unit: isolated deterministic tests",
  "integration_local: tests across local Highland components",
  "acceptance_scripted: end-to-end scenarios using scripted providers",
  "live_model: explicitly opted-in tests that call Cohere",
  "integration: legacy alias for live_model",
  "live_scenario: legacy alias for live_model scenario evaluations",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.13"
files = [
  "src/highland/models/contracts.py",
  "src/highland/maintenance.py",
  "src/highland/repository_quality.py",
  "src/highland/settings.py",
  "src/highland/runtime/events.py",
  "src/highland/workflows/schema.py",
  "src/highland_mocks",
]
warn_unused_configs = true
