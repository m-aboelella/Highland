name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hermetic-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HIGHLAND_MODEL_BACKEND: scripted
      HIGHLAND_RUN_LIVE_TESTS: "0"
      COHERE_API_KEY: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -e '.[dev]'

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Run secret-free quality gates
        run: make ci

      - name: Upload failed deterministic reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-reports
          path: var/highland/reports/
          if-no-files-found: ignore
          retention-days: 7
